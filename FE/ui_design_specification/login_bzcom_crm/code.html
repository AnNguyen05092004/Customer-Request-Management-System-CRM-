<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bzcom CRM - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          font-feature-settings: 'liga';
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#7b2600",
                        "on-background": "#191b23",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#0c56d0",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e1e2ec",
                        "primary": "#003d9b",
                        "background": "#faf8ff",
                        "on-tertiary-fixed": "#380d00",
                        "tertiary-fixed-dim": "#ffb59b",
                        "surface": "#faf8ff",
                        "tertiary-container": "#a33500",
                        "on-primary": "#ffffff",
                        "info-blue": "#00B8D9",
                        "border-subtle": "#DFE1E6",
                        "error-red": "#FF5630",
                        "inverse-on-surface": "#f0f0fb",
                        "on-tertiary-fixed-variant": "#812800",
                        "on-secondary-container": "#576377",
                        "primary-container": "#0052cc",
                        "on-tertiary-container": "#ffc6b2",
                        "on-primary-fixed": "#001848",
                        "secondary-container": "#d4e0f8",
                        "secondary-fixed-dim": "#bbc7de",
                        "on-error": "#ffffff",
                        "surface-container": "#ededf8",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#101c2d",
                        "on-secondary-fixed-variant": "#3b475b",
                        "surface-bright": "#faf8ff",
                        "surface-container-high": "#e7e7f2",
                        "outline-variant": "#c3c6d6",
                        "inverse-primary": "#b2c5ff",
                        "success-green": "#36B37E",
                        "outline": "#737685",
                        "inverse-surface": "#2e3038",
                        "warning-orange": "#FFAB00",
                        "on-primary-fixed-variant": "#0040a2",
                        "secondary-fixed": "#d7e3fb",
                        "surface-container-highest": "#e1e2ec",
                        "secondary": "#535f73",
                        "primary-fixed": "#dae2ff",
                        "surface-dim": "#d9d9e4",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f3f3fd",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-surface": "#191b23",
                        "on-surface-variant": "#434654",
                        "surface-gray": "#F4F5F7",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#c4d2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "4px",
                        "input-height": "40px",
                        "card-padding": "20px",
                        "gutter": "16px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-gray min-h-screen flex items-center justify-center p-gutter font-body-md text-on-surface">
<main class="w-full max-w-[400px]">
<!-- Level 1 Card -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-[32px] shadow-[0_4px_4px_rgba(0,0,0,0.02)] flex flex-col gap-container-margin">
<!-- Header / Logo -->
<div class="text-center flex flex-col items-center gap-base">
<h1 class="font-headline-lg text-headline-lg text-primary">Bzcom</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise CRM</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-gutter" method="POST">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="h-input-height w-full rounded border-border-subtle bg-surface-container-lowest px-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" required="" type="email"/>
</div>
<div class="flex flex-col gap-base">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#" style="font-size: 12px; line-height: 16px;">Forgot password?</a>
</div>
<input class="h-input-height w-full rounded border-border-subtle bg-surface-container-lowest px-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" required="" type="password"/>
</div>
<div class="pt-[8px] flex flex-col gap-[12px]">
<button class="h-input-height w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded transition-colors flex items-center justify-center" type="submit">
                        Login
                    </button>
<button class="h-input-height w-full bg-surface-container-lowest hover:bg-surface-gray border border-border-subtle text-on-surface font-label-md text-label-md rounded transition-colors flex items-center justify-center" type="button">
                        Register as Client
                    </button>
</div>
</form>
</div>
<div class="mt-gutter text-center">
<p class="font-body-md text-body-md text-outline" style="font-size: 12px;">
                Secure Access © 2024 Bzcom CRM
            </p>
</div>
</main>
</body></html>
