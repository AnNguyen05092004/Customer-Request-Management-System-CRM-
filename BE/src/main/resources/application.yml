spring:
  application:
    name: bzcom-crm
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html

crm:
  security:
    jwt:
      access-token-ttl: PT15M
    refresh-token:
      ttl: P7D

llm:
  enabled: ${LLM_ENABLED:false}
  provider: gemini
  model: gemini-2.5-flash
  timeout-ms: 5000
  api-key: ${GEMINI_API_KEY:}
