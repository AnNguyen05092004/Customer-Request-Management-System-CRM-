services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bzcom_crm}
      POSTGRES_USER: ${POSTGRES_USER:-bzcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bzcom_local_password}
    ports:
      # Dùng 5433 ở host để không xung đột PostgreSQL cài trực tiếp trên máy.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bzcom_crm}
      DB_USERNAME: ${POSTGRES_USER:-bzcom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bzcom_local_password}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production-123456}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
